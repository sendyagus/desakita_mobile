
workflows:
  ios-build:
    name: DesaKita iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build iOS app
        script: |
          flutter build ios --release --no-codesign || true

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not generated"
            exit 1
          fi

      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p build/ios/ipa
          cd Payload/..
          zip -r build/ios/ipa/DesaKita.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
