
workflows:
  ios-build:
    name: DesaKita iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

   
scripts:
  - name: Get dependencies
    script: |
      flutter pub get

  - name: Prepare Flutter iOS
    script: |
      flutter build ios --release --no-codesign || true

  - name: Build unsigned iOS app using Xcode
    script: |
      xcodebuild \
        -workspace ios/Runner.xcworkspace \
        -scheme Runner \
        -configuration Release \
        -sdk iphoneos \
        -destination 'generic/platform=iOS' \
        -derivedDataPath build/ios/derived \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        build

  - name: Package IPA
    script: |
      APP_PATH="build/ios/derived/Build/Products/Release-iphoneos/Runner.app"

      if [ ! -d "$APP_PATH" ]; then
        echo "Runner.app not found"
        exit 1
      fi

      mkdir -p Payload build/ios/ipa
      cp -R "$APP_PATH" Payload/
      zip -r build/ios/ipa/DesaKita.ipa Payload

artifacts:
  - build/ios/ipa/*.ipa
